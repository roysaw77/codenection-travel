<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#124c45">
  <title>Senior Travel Companion | Interactive Prototype</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
  <script src="views.js" defer></script>
</head>
<body>
  <a class="skip" href="#screen">Skip to app</a>
  <header class="demo-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true">sc</span><div>Senior Travel Companion<small>INTERACTIVE DESIGN PROTOTYPE</small></div></div>
    <div class="role-switch" aria-label="Preview role">
      <button data-role="parent" aria-pressed="true">Parent view</button>
      <button data-role="child" aria-pressed="false">Family view</button>
    </div>
    <button class="reset" id="reset">Reset demo</button>
  </header>
  <div class="demo-note">UI concept · Sample tours, scores and alerts · No live services</div>
  <div class="workspace">
    <aside class="context">
      <p class="eyebrow">SENIOR TRAVEL COMPANION</p>
      <h1>Good trips.<br>Peace of mind.</h1>
      <p>Find the right tour.<br>Stay close, wherever they go.</p>
      <div class="people"><span class="avatar">ML</span><span class="avatar secondary">AL</span><div><strong>Mei &amp; Anna</strong><small>Mother &amp; daughter</small></div></div>
      <nav class="preview-menu" aria-label="Preview screens">
        <button data-preview="tours"><span>01</span> Tour matching</button>
        <button data-preview="trust"><span>02</span> Tour transparency</button>
        <button data-preview="advisor"><span>03</span> Travel advisor</button>
        <button data-preview="dashboard"><span>04</span> Family dashboard</button>
        <button data-preview="parent"><span>05</span> Senior simple mode</button>
        <button data-preview="alerts"><span>06</span> Safety alerts</button>
      </nav>
    </aside>
    <section class="app-shell" aria-label="Travel app prototype">
      <div class="app-brand"><strong>companion<span aria-hidden="true">.</span></strong><span>Travel, together</span></div>
      <main id="screen" tabindex="-1"></main>
      <nav id="app-nav" aria-label="App navigation"></nav>
    </section>
  </div>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
